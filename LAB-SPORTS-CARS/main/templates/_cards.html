{% load static %}
<div class="grid">

  <!-- Porsche -->
  <div class="card">
    <a class="card-img" href="{% url 'porsche' %}">
<img src="{% static 'img/porsche/main.jpg' %}" alt="Porsche 911 Turbo S">    </a>
    <div class="card-body">
      <a href="{% url 'porsche' %}"><h3>Porsche 911 Turbo S</h3><p>SAR 1,295,000</p></a>
      <span class="material-symbols-outlined heart">favorite</span>
    </div>
  </div>

  <!-- Ferrari -->
  <div class="card">
    <a class="card-img" href="{% url 'ferrari' %}">
      <img src="{% static 'img/ferrari-f8-tributo.jpg' %}" alt="Ferrari F8 Tributo">
    </a>
    <div class="card-body">
      <a href="{% url 'ferrari' %}"><h3>Ferrari F8 Tributo</h3><p>SAR 1,490,000</p></a>
      <span class="material-symbols-outlined heart">favorite</span>
    </div>
  </div>

  <!-- Lamborghini -->
  <div class="card">
    <a class="card-img" href="{% url 'lamborghini' %}">
<img src="{% static 'img/lamborghini/main.jpg' %}" alt="Lamborghini Huracán">    </a>
    <div class="card-body">
      <a href="{% url 'lamborghini' %}"><h3>Lamborghini Huracán</h3><p>SAR 1,420,000</p></a>
      <span class="material-symbols-outlined heart">favorite</span>
    </div>
  </div>

</div>
