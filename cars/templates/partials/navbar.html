<header class="nav">
  <a class="logo" href="{% url 'home' %}">
    <span class="material-symbols-outlined">directions_car</span> FordKSA
  </a>

  <nav class="links" id="links">
    {% with current=request.resolver_match.url_name %}
      <a href="{% url 'home' %}" class="{% if current == 'home' %}active{% endif %}">Home</a>
      <a href="{% url 'cars' %}" class="{% if current == 'cars' or current == 'car_detail' %}active{% endif %}">Cars</a>
      <a href="{% url 'about' %}" class="{% if current == 'about' %}active{% endif %}">About Us</a>
      <a href="https://www.instagram.com/ford/" target="_blank" rel="noopener">Contact</a>
    {% endwith %}
  </nav>

  <div class="nav-actions">
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
      <span class="material-symbols-outlined">dark_mode</span>
    </button>
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
      <span class="material-symbols-outlined">menu</span>
    </button>
  </div>
</header>
