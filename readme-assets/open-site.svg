    <path d="M29 43l29-6 34-16c8-4 17-6 27-6h25c13 0 24 3 33 9l25 15 27 5 12 7 3 10-5 6h-21a15 15 0 0 0-30 0H78a15 15 0 0 0-30 0H31l-7-5 2-15z" fill="url(#paint)" stroke="#243d55" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M68 38l29-15c6-3 14-4 22-4h25c12 0 21 3 30 8l20 12h-47l-35-2z" fill="#172a3c"/>
    <path d="M81 35l18-10c5-3 12-4 19-4h8l-4 14zm47 0 3-14h12c11 0 21 3 29 8l12 7h-36z" fill="#37556e"/>
    <path d="M128 21l-3 16m47-10 18 12" fill="none" stroke="#152536" stroke-width="2"/>
    <path d="M33 46l39-5-14 6-24 3zm148-4 31 1 16 3-17 2z" fill="#d5ebfb"/>
    <path d="M26 48l13-2-5 4-9 1z" fill="#b11e32"/>
    <path d="M225 47l11 3 5 4-12-2z" fill="#eef8ff"/>
    <path d="M238 56h4l2 5-5 6h-17l5-6z" fill="#233849"/>
    <path d="M31 66h14m35 0h106m34 0h17" fill="none" stroke="#b52037" stroke-width="2.5" stroke-linecap="round"/>
    <g transform="translate(63 65)"><use class="rim" href="#rim"/></g>
    <g transform="translate(203 65)"><use class="rim" href="#rim"/></g>
    <text x="92" y="57" fill="#102438" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".6">OPEN SITE</text>
