<svg xmlns="http://www.w3.org/2000/svg" width="252" height="84" viewBox="0 0 252 84">
  <title>Open Site</title>
  <defs>
    <linearGradient id="paint" x2="0" y2="1">
      <stop stop-color="#c8e2f7"/>
      <stop offset=".56" stop-color="#95bcdf"/>
      <stop offset="1" stop-color="#5e8ab7"/>
    </linearGradient>
    <g id="rim">
      <circle r="12" fill="#222d39" stroke="#101821" stroke-width="1.5"/>
      <circle r="8" fill="#344556" stroke="#8194a7" stroke-width="1"/>
      <path d="M0-6v12m-5.7-7.9 11.4 3.8m-9.2 3.1 7-10" fill="none" stroke="#b4c4d4" stroke-width="1.3" stroke-linecap="round"/>
      <circle r="2" fill="#d3e0eb"/>
    </g>
  </defs>
  <style>
    @keyframes arrive {
      from { transform: translateX(-20px); }
      to { transform: translateX(0); }
    }
    @keyframes spin {
      from { transform: rotate(-96deg); }
      to { transform: rotate(0); }
    }
    @keyframes fade-in {
      from { opacity: .8; }
      to { opacity: 1; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .car { animation: arrive 800ms cubic-bezier(.2, 0, 0, 1) both; }
      .rim {
        animation: spin 800ms cubic-bezier(.2, 0, 0, 1) both;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .car { animation: fade-in 150ms ease-out both; }
    }
  </style>
  <g class="car">
