{% load static %}
<article class="car-card" data-car-card data-slug="{{ car.slug }}" data-brand="{{ car.brand }}" data-model="{{ car.model }}" data-name="{{ car.name }}" data-price="{{ car.demo_price_sar }}" data-year="{{ car.year }}">
  <a href="{% url 'showroom:'|add:car.url_name %}" class="car-card-image" aria-label="View {{ car.name }}">
    <img src="{% static car.image.path %}" alt="{{ car.image.alt }}" width="600" height="375" loading="lazy">
  </a>
  <div class="car-card-body">
    <h3><a href="{% url 'showroom:'|add:car.url_name %}">{{ car.name }}</a></h3>
    <p class="car-price">SAR {{ car.demo_price_sar|floatformat:'0g' }}</p>
    <button class="icon-button wishlist-button" type="button" data-wishlist="{{ car.slug }}" aria-label="Save {{ car.name }} to wishlist" aria-pressed="false">{% include 'components/icon.html' with name='favorite' %}</button>
  </div>
</article>
